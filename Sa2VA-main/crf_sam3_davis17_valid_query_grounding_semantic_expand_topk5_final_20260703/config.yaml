concept_extraction:
  category_prompt_path: configs/category_num_targets_inference_merged.txt
  max_new_tokens: 128
  teacher_pipeline_compatible: true
  teacher_pipeline_deterministic: true
  teacher_pipeline_num_frames: 3
  temperature: 0.2
  use_qframe: false
dataset:
  data_root: /mnt/csip-500/share/kongjiawei/Sa2VA/data/video_datas/davis17
  gt_masks_root: /mnt/csip-500/share/kongjiawei/Sa2VA/data/video_datas/davis17/valid/Annotations
  max_expressions: null
  max_videos: null
  skip_existing: true
  split: valid
demo:
  exp_id: 1
  mevis_root: /mnt/csip-200/share/kongjiawei/Sa2VA/data/video_datas/mevis/valid_u
  output_dir: crf_sam3_demo_output
  video_id: ed7d7148e132
discrimination:
  backend: mllm
  embedding:
    bbox_doc_text: This video segment shows a candidate object inside a bbox.
    bbox_instruction: Represent the referring expression and the bboxed object for
      matching.
    doc_text: This video segment shows a masked green candidate object.
    embedding_repo: Qwen3-VL-Embedding
    instruction: Represent the referring expression and the masked green object for
      matching.
    max_frames: 8
    model_path: /mnt/csip-200/share/kongjiawei/Sa2VA-main/Qwen3-VL-Embedding-2B
    num_frames: 8
    torch_dtype: bfloat16
  prompt_type: yesno
  reranker:
    bbox_instruction: Judge whether the object inside the blue bbox matches it.
    embedding_repo: Qwen3-VL-Embedding
    instruction: Judge whether the masked green object in the video matches the referring
      expression.
    max_frames: 8
    model_path: /mnt/csip-200/share/kongjiawei/Sa2VA-main/Qwen3-VL-Reranker-2B
    num_frames: 8
logging:
  level: INFO
  log_file: logs/davis17_valid_query_grounding_semantic_expand_topk5_final_20260703_inner.log
  print_mllm_responses: true
  print_timing: true
  use_tqdm: true
model:
  base_mllm_path: /mnt/csip-500/share/kongjiawei/Sa2VA-main/Qwen3-VL-4B-Instruct
  clip_model_path: /mnt/csip-200/share/kongjiawei/q-frame-master/Long-CLIP/checkpoints/longclip-L.pt
  mllm_adapter_path: /mnt/csip-500/share/kongjiawei/Sa2VA-main/crf_sam3_attn_outputs_joint_train_poswin_dms_recall24_keep7_filter_failures_20260623/final
  mllm_path: /mnt/csip-500/share/kongjiawei/Sa2VA-main/Qwen3-VL-4B-Instruct
  model_type: qwen3
  sam3_checkpoint: /mnt/csip-500/share/kongjiawei/sam3-main/sam3-main/checkpoints/sam3/sam3.pt
output:
  format: mevis
  output_dir: crf_sam3_davis17_valid_query_grounding_semantic_expand_topk5_final_20260703
  save_scores: true
  save_visual_tubes: false
performance:
  batch_size: 1
  clear_cache_per_video: true
  num_workers: 4
  use_amp: true
pipeline:
  device: auto
  dtype: bfloat16
  num_tube_frames: 8
sam3_recall:
  async_loading_frames: false
  backend: dms
  candidate_keep_top_k: 7
  candidate_recall_top_k: 24
  dms_repo: /mnt/csip-500/share/kongjiawei/Sa2VA-main/SAM3-DMS
  gpus_to_use:
  - 0
  max_frame_num_to_track: null
  semantic_query_expander:
    bank_path: category_grounding_mvp/data/sam3_text_prototypes/lvis_v1_category/prototype_bank.pt
    candidate_pool_size: 24
    checkpoint_path: /mnt/csip-500/share/kongjiawei/sam3-main/sam3-main/checkpoints/sam3/sam3.pt
    device: cuda
    diversity_lambda: 0.65
    enabled: true
    exclude_self: true
    log: true
    metadata_path: category_grounding_mvp/data/sam3_text_prototypes/lvis_v1_category/prototype_meta.json
    min_similarity: 0.55
    sam3_repo: /mnt/csip-500/share/kongjiawei/Sa2VA-main/SAM3-DMS
    top_k: 5
    trigger:
      min_frames_with_masks: 3
      min_object_score_sum: 8.0
      quality_field: max_object_score_sum
  video_loader_type: cv2
visual_tube:
  custom_frame_indices:
  - 90
  - 94
  - 95
  - 96
  - 100
  - 102
  - 108
  - 111
  include_context: false
  qframe:
    tau: 0.8
  sampling_strategy: uniform
  visualization_style: mask
