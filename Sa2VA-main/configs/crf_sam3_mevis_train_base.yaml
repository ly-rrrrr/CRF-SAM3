# Base config for CRF-SAM3 attention training on MeViS train split.

model:
  model_type: "qwen3"
  mllm_path: "/mnt/csip-500/share/kongjiawei/Sa2VA-main/Qwen3-VL-4B-Instruct"
  sam3_checkpoint: "/mnt/csip-500/share/kongjiawei/sam3-main/sam3-main/checkpoints/sam3/sam3.pt"
  clip_model_path: "/mnt/csip-500/share/kongjiawei/q-frame-master/Long-CLIP/checkpoints/longclip-L.pt"

pipeline:
  num_tube_frames: 8
  device: "auto"
  dtype: "bfloat16"

sam3_recall:
  # Mainline candidate generator: SAM3-DMS improves temporal consistency.
  # Use a wider SAM3/DMS recall budget, then keep a compact final set using
  # the sum of native per-frame SAM3 object confidence scores.
  backend: "dms"
  dms_repo: "/mnt/csip-500/share/kongjiawei/Sa2VA-main/SAM3-DMS"
  gpus_to_use: [0]
  candidate_recall_top_k: 24
  candidate_keep_top_k: 7
  async_loading_frames: false
  video_loader_type: "cv2"
  max_frame_num_to_track: null

concept_extraction:
  use_qframe: false
  category_prompt_path: "configs/category_num_targets_inference_merged.txt"
  teacher_pipeline_compatible: true
  teacher_pipeline_num_frames: 3
  teacher_pipeline_deterministic: true

visual_tube:
  sampling_strategy: "uniform"
  visualization_style: "mask"
  qframe:
    tau: 0.8

dataset:
  data_root: "/mnt/csip-500/share/kongjiawei/Sa2VA/data/video_datas/mevis"
  split: "train"
  gt_source: "mask_dict"
  mask_dict_path: "mask_dict.json"
  gt_masks_root: ""
