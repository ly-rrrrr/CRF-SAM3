# Base config for CRF-SAM3 attention training on Ref-Youtube-VOS train split.
# NOTE:
#   CRFSAM3AttnDataset expects a MeViS-like layout:
#   <data_root>/<split>/meta_expressions.json
#   <data_root>/<split>/JPEGImages/<video_id>/*.jpg
#   Ref-Youtube-VOS expression-level GT must be recovered from train/mask_dict.pkl,
#   not from train/Annotations.

model:
  model_type: "qwen3"
  mllm_path: "/mnt/csip-500/share/kongjiawei/Sa2VA-main/crf_sam3_attn_outputs_davis_train_merged"
  sam3_checkpoint: "/mnt/csip-500/share/kongjiawei/sam3-main/checkpoints/sam3/sam3.pt"
  clip_model_path: "/mnt/csip-500/share/kongjiawei/q-frame-master/Long-CLIP/checkpoints/longclip-L.pt"

pipeline:
  num_tube_frames: 8
  device: "auto"
  dtype: "bfloat16"

concept_extraction:
  use_qframe: false

visual_tube:
  sampling_strategy: "uniform"
  visualization_style: "mask"
  qframe:
    tau: 0.8

dataset:
  data_root: "/mnt/csip-500/share/kongjiawei/Sa2VA/data/video_datas/Ref-Youtube-VOS"
  split: "train"
  gt_source: "mask_dict"
  mask_dict_path: "mask_dict.pkl"
  gt_masks_root: ""
