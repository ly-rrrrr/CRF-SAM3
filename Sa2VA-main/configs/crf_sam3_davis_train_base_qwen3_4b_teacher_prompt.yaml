# Base config for DAVIS17 offline prompt experiment.
# Purpose: reuse the original offline-cache generation flow, but swap the
# concept-extraction prompt to the teacher pipeline compatible prompt.

model:
  model_type: "qwen3"
  mllm_path: "/mnt/csip-500/share/kongjiawei/Sa2VA-main/Qwen3-VL-4B-Instruct"
  sam3_checkpoint: "/mnt/csip-500/share/kongjiawei/sam3-main/sam3-main/checkpoints/sam3/sam3.pt"
  clip_model_path: "/mnt/csip-200/share/kongjiawei/q-frame-master/Long-CLIP/checkpoints/longclip-L.pt"

pipeline:
  num_tube_frames: 8
  device: "auto"
  dtype: "bfloat16"

concept_extraction:
  use_qframe: false
  category_prompt_path: "configs/category_num_targets_inference_merged.txt"
  teacher_pipeline_compatible: true
  teacher_pipeline_num_frames: 3
  teacher_pipeline_deterministic: true

visual_tube:
  sampling_strategy: "uniform"
  visualization_style: "mask"
  qframe:
    tau: 0.8

dataset:
  data_root: "/mnt/csip-500/share/kongjiawei/Sa2VA/data/video_datas/davis17"
  split: "train"
  gt_source: "mask_dict"
  mask_dict_path: "mask_dict.pkl"
  gt_masks_root: ""
