# Base config for CRF-SAM3 attention training on RE-VOS train split.
# NOTE:
#   CRFSAM3AttnDataset expects a MeViS-like layout:
#   <data_root>/<split>/meta_expressions.json
#   <data_root>/<split>/JPEGImages/<video_id>/*.jpg
# Please point data_root to your prepared RE-VOS training root.

model:
  model_type: "qwen3"
  mllm_path: "/mnt/csip-200/share/kongjiawei/Sa2VA-main/Qwen3-VL-4B-Instruct"
  sam3_checkpoint: "/mnt/csip-200/share/kongjiawei/sam3-main/checkpoints/sam3/sam3.pt"
  clip_model_path: "/mnt/csip-200/share/kongjiawei/q-frame-master/Long-CLIP/checkpoints/longclip-L.pt"

pipeline:
  num_tube_frames: 8
  device: "auto"
  dtype: "bfloat16"

concept_extraction:
  use_qframe: false

visual_tube:
  sampling_strategy: "uniform"
  visualization_style: "mask"
  qframe:
    tau: 0.8

dataset:
  data_root: "/mnt/csip-200/share/kongjiawei/Sa2VA/data/video_datas/revos_prepared"
  split: "train"
  gt_masks_root: "/mnt/csip-200/share/kongjiawei/Sa2VA/data/video_datas/revos_prepared/gt_masks_train_expr"
