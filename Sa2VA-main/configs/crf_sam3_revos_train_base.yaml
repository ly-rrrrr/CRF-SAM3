# Base config for CRF-SAM3 attention training on ReVOS.
# Build the lightweight prepared view first:
#   python tools/prepare_revos_mevis_layout.py
# Layout expected by CRFSAM3AttnDataset:
#   <data_root>/<split>/meta_expressions.json
#   <data_root>/<split>/JPEGImages/<video_id>/*.jpg

model:
  model_type: "qwen3"
  mllm_path: "/mnt/csip-500/share/kongjiawei/Sa2VA-main/Qwen3-VL-4B-Instruct"
  sam3_checkpoint: "/mnt/csip-500/share/kongjiawei/sam3-main/sam3-main/checkpoints/sam3/sam3.pt"
  clip_model_path: "/mnt/csip-200/share/kongjiawei/q-frame-master/Long-CLIP/checkpoints/longclip-L.pt"

pipeline:
  num_tube_frames: 8
  device: "auto"
  dtype: "bfloat16"

concept_extraction:
  use_qframe: false
  category_prompt_path: "configs/category_num_targets_inference_merged.txt"
  teacher_pipeline_compatible: true
  teacher_pipeline_num_frames: 3
  teacher_pipeline_deterministic: true

sam3_recall:
  backend: "dms"
  dms_repo: "/mnt/csip-500/share/kongjiawei/Sa2VA-main/SAM3-DMS"
  gpus_to_use: [0]
  candidate_recall_top_k: 24
  candidate_keep_top_k: 7
  # For long ReVOS/TAO videos, this pair avoids preloading all 1008px frames on GPU.
  async_loading_frames: true
  offload_video_to_cpu: true
  offload_output_to_cpu_for_eval: true
  trim_past_non_cond_mem_for_eval: false
  # Use raise to expose the real capability boundary instead of silently rescuing/skipping OOM cases.
  oom_policy: raise
  # null means full-video propagation. Set an integer only for partial smoke runs.
  max_frame_num_to_track: null

visual_tube:
  sampling_strategy: "uniform"
  visualization_style: "mask"
  qframe:
    tau: 0.8

dataset:
  name: "revos"
  data_root: "/mnt/csip-500/share/kongjiawei/Sa2VA/data/video_datas/revos_prepared"
  split: "train"
  gt_source: "mask_dict"
  mask_dict_path: "mask_dict.json"
  gt_masks_root: ""
