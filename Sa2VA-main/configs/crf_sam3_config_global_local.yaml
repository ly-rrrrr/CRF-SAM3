# CRF-SAM3 Global-Local Configuration

model:
  model_type: "qwen3"
  mllm_path: "/mnt/csip-200/share/kongjiawei/Sa2VA-main/Qwen3-VL-4B-Instruct"
  sam3_checkpoint: "/mnt/csip-200/share/kongjiawei/sam3-main/checkpoints/sam3/sam3.pt"
  clip_model_path: "/mnt/csip-200/share/kongjiawei/q-frame-master/Long-CLIP/checkpoints/longclip-L.pt"

pipeline:
  num_tube_frames: 4
  device: "auto"
  dtype: "bfloat16"

demo:
  mevis_root: "/mnt/csip-200/share/kongjiawei/Sa2VA/data/video_datas/mevis/valid_u"
  # video_id: "8a3ceef4f248"
  video_id: "3dde46eaaf53"
  exp_id: 10
  output_dir: "crf_sam3_global_local_output"

concept_extraction:
  use_qframe: false
  max_new_tokens: 128
  temperature: 0.1
  use_fallback: true

visual_tube:
  sampling_strategy: "uniform"
  custom_frame_indices: []
  qframe:
    tau: 0.8

discrimination:
  prompt_type: "three_level"
  # backend: "reranker"
  backend: "mllm"
  mllm:
    prompt_type: "three_level"
    prompt_template_path: "configs/three_level_ttrl_cot_global_local.txt"
  reranker:
    model_path: "/mnt/csip-200/share/kongjiawei/Sa2VA-main/Qwen3-VL-Reranker-2B"
    instruction: >
      You are given a query (referring expression) and a document video.
      The document frames are ordered as [G1, L1, G2, L2, ...].
      G = global full scene. L = composite of the same candidate object sampled every few
      frames between G_i and G_{i+1} (inclusive), with background blacked out.
      L may show multiple positions of the same object (motion trail).
      The decision MUST be based primarily on L: judge whether the object in L matches
      the referring expression. Use G only to verify spatial relations if the expression mentions them.
      Ignore other objects in G. Answer yes/no based on L-to-text alignment.
    doc_text: >
      Document video shows the same candidate object across frames.
      Odd frames are global; even frames are local composites (background black) showing
      the object's positions sampled between adjacent global frames.
    num_frames: 8
    max_frames: 8
    embedding_repo: "Qwen3-VL-Embedding"

global_local:
  prompt_template_path: "configs/three_level_ttrl_cot_global_local.txt"
  temp_dir: "visual_tubes_global_local"
  local_size: 448
  local_pad_ratio: 0.1
  min_box_size: 16
  global_size: null
  align_local_to_global: true
  local_max_scale: 1.0
  local_min_fill_ratio: null
  local_use_mask: true
  local_composite: true
  local_composite_strategy: "interval_step"
  local_interval_stride: 2
  local_interval_include_end: true
  local_overlap_threshold: 0.0
  local_composite_max_frames: null
  local_composite_frames: 3
  local_motion_threshold: 0.02
  local_motion_min_gap: 1
  local_composite_alpha: 0.55
  local_composite_outline_only: false
  local_composite_mode: "rgb"
